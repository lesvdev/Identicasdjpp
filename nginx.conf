# ── Nginx config para IdentiCASD-JPP ─────────────────────────────
# Coloca este archivo en: /etc/nginx/sites-available/identicasd
# Luego: sudo ln -s /etc/nginx/sites-available/identicasd /etc/nginx/sites-enabled/
# Y:     sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name TU_DOMINIO_O_IP;   # ← reemplaza esto

    # Tamaño máximo de subida (debe ser >= MAX_FILE_MB en .env)
    client_max_body_size 20M;

    # Proxy al servidor Node.js
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Timeout más largo para uploads grandes
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Cache para imágenes subidas (1 día)
    location /fotos/ {
        proxy_pass       http://localhost:3000/fotos/;
        proxy_cache_bypass 0;
        add_header Cache-Control "public, max-age=86400";
    }
}

# ── HTTPS (agrega después de correr: sudo certbot --nginx -d TU_DOMINIO) ──
# certbot lo configura automáticamente, no edites esta sección a mano.
