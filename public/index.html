<style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{
      scroll-behavior:smooth;
      overflow-x:hidden;
      -webkit-text-size-adjust:100%;
    }
    body{
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      background:#F5F5F0;
      color:#1a1a1a;
      overflow-x:hidden;
      width:100%;
    }
    .serif{font-family:'Playfair Display',Georgia,serif;}

    /* Scrollbar */
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-thumb{background:#0A7E46;border-radius:4px;}

    /* Marco Institucional Mobile-First */
    .inst-frame{
      border:8px solid #004D26;
      box-shadow:0 0 0 2px #D92323,0 0 0 4px #004D26,4px 4px 16px rgba(0,0,0,0.22);
      background:#FCFCF8;
      width:100%;
      max-width:100%;
      box-sizing:border-box;
    }
    .frame-hdr{background:linear-gradient(135deg,#004D26,#0A7E46);}

    /* Masonry / Grilla de Fotos */
    .masonry{
      columns:3;
      column-gap:1.25rem;
      width:100%;
    }
    .masonry-item{
      break-inside:avoid;
      margin-bottom:1.25rem;
      width:100%;
    }
    .clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

    /* Previsualización del marco en Panel Docente */
    .teacher-frame-wrap{
      transform:scale(0.85);
      transform-origin:top center;
      margin-bottom:-50px;
      pointer-events:none;
      width:100%;
    }

    /* ── REGLAS ESPECÍFICAS PARA CELULARES (Mobile First < 768px) ── */
    @media (max-width: 768px) {
      /* 1. Prevenir zoom automático en iPhone */
      input, select, textarea, button {
        font-size: 16px !important;
      }

      /* 2. Marco adaptable a la pantalla del teléfono */
      .inst-frame {
        border: 5px solid #004D26 !important;
        box-shadow: 0 0 0 1.5px #D92323, 0 0 0 3px #004D26, 3px 3px 12px rgba(0,0,0,0.18) !important;
      }
      .teacher-frame-wrap {
        transform: none !important;
        margin-bottom: 12px !important;
      }

      /* 3. Galería: 1 sola columna amplia y cómoda en celular */
      .masonry {
        columns: 1 !important;
      }

      /* 4. Grillas adaptadas a 1 columna */
      .grid-2col, .grid-3col, .grid-4col, .submit-layout, .teacher-layout, .footer-grid {
        grid-template-columns: 1fr !important;
        gap: 16px !important;
      }

      /* 5. Filtros de búsqueda fáciles de presionar */
      .gallery-filters {
        grid-template-columns: 1fr !important;
        gap: 10px !important;
      }

      /* 6. Panel docente: fijado dinámico sin salto */
      .detail-sticky {
        position: static !important;
        top: auto !important;
        margin-top: 16px !important;
      }

      /* 7. Notificaciones Toast centradas en móvil */
      .toast-in {
        right: 12px !important;
        left: 12px !important;
        max-width: calc(100vw - 24px) !important;
        justify-content: center !important;
      }

      /* 8. Textos y títulos compactos */
      .hero-title {
        font-size: 38px !important;
      }
      .hero-subtitle {
        font-size: 18px !important;
      }
      .mobile-stack {
        flex-direction: column !important;
        align-items: stretch !important;
      }
      .mobile-full-btn {
        width: 100% !important;
        justify-content: center !important;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .masonry { columns: 2; }
    }

    /* Animaciones */
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    @keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes toastOut{to{opacity:0;}}
    .fadeUp{animation:fadeUp 0.4s ease forwards;}
    .toast-in{animation:toastIn 0.3s ease,toastOut 0.4s ease 2.8s forwards;}

    .card-shadow{box-shadow:0 1px 4px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.04);transition:box-shadow 0.2s,transform 0.2s;}
    .card-shadow:hover{box-shadow:0 4px 20px rgba(10,126,70,0.15);transform:translateY(-2px);}
    
    /* Nav buttons */
    .nav-active{background:#0A7E46!important;color:white!important;}
    .nav-item{transition:all 0.2s;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;background:transparent;min-height:44px;}
    .nav-item:hover:not(.nav-active){background:#f0fdf4;color:#0A7E46;}

    .btn-red{background:#D92323;color:white;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;transition:all 0.2s;min-height:44px;}
    .btn-red:hover{background:#b91c1c;transform:translateY(-1px);box-shadow:0 4px 16px rgba(217,35,35,0.35);}
    
    .btn-outline-dark{background:rgba(0,0,0,0.25);color:white;border:1.5px solid rgba(255,255,255,0.4);cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;transition:all 0.2s;min-height:44px;}
    .btn-outline-dark:hover{background:rgba(255,255,255,0.1);border-color:white;}
    .step-num{font-size:38px;font-weight:800;color:#e5e7eb;line-height:1;position:absolute;top:10px;right:14px;}
  </style>
</head>

const svgImg = (cat, seed) => {
  const cfg = {
    'Flora':{bg:'#0d3320',c1:'#1a6b38',c2:'#2d9e57',e:'🌿'},
    'Fauna':{bg:'#2d1500',c1:'#7a3510',c2:'#c4620e',e:'🦋'},
    'Microorganismos':{bg:'#1a0d3d',c1:'#5b21b6',c2:'#8b5cf6',e:'🔬'},
    'Paisaje Escolar':{bg:'#0a1f4a',c1:'#1d4ed8',c2:'#60a5fa',e:'🏫'},
  };
  const c = cfg[cat]||cfg['Flora'];
  const cx1=120+(seed%3)*40, cy1=100+(seed%2)*30, cx2=250-(seed%4)*20, cy2=160+(seed%3)*20;
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="${c.bg}"/><circle cx="${cx1}" cy="${cy1}" r="90" fill="${c.c1}" opacity="0.6"/><circle cx="${cx2}" cy="${cy2}" r="65" fill="${c.c2}" opacity="0.4"/><text x="200" y="155" text-anchor="middle" font-size="72" font-family="sans-serif">${c.e}</text><text x="200" y="215" text-anchor="middle" fill="white" font-size="13" font-family="sans-serif" opacity="0.6">Muestra · ${cat}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
};

const Toast = ({msg,type,onDone}) => {
  useEffect(()=>{const t=setTimeout(onDone,3200);return()=>clearTimeout(t);});
  const bg={success:'#16a34a',error:'#dc2626',info:'#2563eb'}[type]||'#374151';
  return <div className="toast-in" style={{position:'fixed',top:16,right:16,zIndex:200,background:bg,color:'white',padding:'12px 20px',borderRadius:14,boxShadow:'0 8px 32px rgba(0,0,0,0.2)',display:'flex',gap:10,alignItems:'center',fontFamily:'Inter,sans-serif',fontSize:13,fontWeight:500,maxWidth:360}}>{{'success':'✅','error':'❌','info':'ℹ️'}[type]} {msg}</div>;
};

const SAMPLE_PHOTOS = [
  {label:'Iguana verde (Patio CASD-JPP)',cat:'Fauna Urbana',img:svgImg('Fauna Urbana',0)},
  {label:'Heliconia Platanillo',cat:'Flora',img:svgImg('Flora',1)},
  {label:'Mariposa Pasionaria',cat:'Fauna',img:svgImg('Fauna',2)},
  {label:'Líquenes de árbol',cat:'Hongos y Líquenes',img:svgImg('Microorganismos',3)},
];

const SubmitPage = ({onSubmit, notify}) => {
  const [form,setForm] = useState({name:'',date:new Date().toISOString().slice(0,10),grade:'601',subject:'Ciencias Naturales y Ed. Ambiental',category:'Micro-naturaleza',description:'',image:null});
  const [imageFile,setImageFile] = useState(null);
  const [imgPrev,setImgPrev] = useState(null);
  const [orientation,setOrientation] = useState('Horizontal');
  const [ethicsOk,setEthicsOk] = useState(false);
  const [submitting,setSubmitting] = useState(false);
  const fileRef = useRef();

  const set = k => e => setForm(f=>Object.assign({...f},{[k]:e.target.value}));
  const setCat = c => setForm(f=>Object.assign({...f},{category:c}));

  const handleFile = e => {
    const file=e.target.files[0]; if(!file) return;
    setImageFile(file);
    const r=new FileReader();
    r.onloadend=()=>{setImgPrev(r.result);setForm(f=>Object.assign({...f},{image:r.result}));};
    r.readAsDataURL(file);
  };
  const useSample = s => {
    setImgPrev(s.img);
    setForm(f=>Object.assign({...f},{image:s.img,category:s.cat}));
  };

  const canSubmit = form.name && form.grade && form.subject && form.category && form.description && ethicsOk && imageFile;
  const submit = e => {
    e.preventDefault(); if(!canSubmit) return;
    setSubmitting(true);
    onSubmit(form, imageFile).then(ok=>{
      if(ok){
        setForm(f=>Object.assign({...f},{name:'',description:'',image:null}));
        setImgPrev(null);
        setImageFile(null);
        setEthicsOk(false);
      }
      setSubmitting(false);
    });
  };

  const inp = {width:'100%',border:'2px solid #e5e7eb',borderRadius:10,padding:'10px 14px',fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',background:'white',boxSizing:'border-box',transition:'border 0.2s',color:'#1a1a1a'};
  const focus = e=>{e.target.style.borderColor=VERDE;};
  const blur  = e=>{e.target.style.borderColor='#e5e7eb';};
  const label = {fontSize:11,fontWeight:700,color:'#6b7280',letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:6,display:'block'};

  return (
    <div style={{background:CREMA,minHeight:'100vh'}}>

      {/* ── Page Hero ── */}
      <div style={{padding:'28px 24px 0',maxWidth:1280,margin:'0 auto'}}>
        <div style={{background:`linear-gradient(160deg,${VERDE_HERO} 0%,#0f4d28 100%)`,borderRadius:20,padding:'32px 40px',display:'flex',alignItems:'center',gap:20}}>
          <div style={{background:ROJO,width:56,height:56,borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,flexShrink:0}}>📷</div>
          <div>
            <h2 className="serif" style={{fontSize:'clamp(22px,3vw,32px)',fontWeight:800,color:'white',marginBottom:4}}>Postulación de Fotografía</h2>
            <p style={{color:'#a7f3d0',fontSize:14}}>Ingresa tus datos y observa la previsualización en tiempo real del Marco Institucional oficial.</p>
          </div>
        </div>
      </div>

      {/* ── Content ── */}
      <div style={{maxWidth:1280,margin:'0 auto',padding:'28px 24px 48px'}}>
        <div className="submit-layout" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:28,alignItems:'start'}}>

          {/* ─ LEFT: Form ─ */}
          <form onSubmit={submit} style={{background:'white',borderRadius:20,padding:'28px 32px',boxShadow:'0 2px 16px rgba(0,0,0,0.05)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'2px solid #f3f4f6',paddingBottom:14,marginBottom:22}}>
              <span style={{fontSize:16,fontWeight:800,color:'#1a1a1a'}}>Formulario de Datos</span>
              <span style={{fontSize:12,color:'#888',fontStyle:'italic'}}>Estudiante CASD</span>
            </div>

            {/* 1. Nombre */}
            <div style={{marginBottom:18}}>
              <label style={label}>1. Nombres y Apellidos Completos *</label>
              <input value={form.name} onChange={set('name')} onFocus={focus} onBlur={blur} required placeholder="Ej. Juan Carlos Pérez Gómez" style={inp}/>
            </div>

            {/* 2 & 3. Fecha + Grado */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:18}}>
              <div>
                <label style={label}>2. Fecha *</label>
                <input type="date" value={form.date} onChange={set('date')} onFocus={focus} onBlur={blur} required style={inp}/>
              </div>
              <div>
                <label style={label}>3. Grado *</label>
                <select value={form.grade} onChange={set('grade')} onFocus={focus} onBlur={blur} required style={inp}>
                  {GRADES.map(g=><option key={g} value={g}>{g}</option>)}
                </select>
              </div>
            </div>

            {/* 4. Asignatura */}
            <div style={{marginBottom:18}}>
              <label style={label}>4. Asignatura *</label>
              <select value={form.subject} onChange={set('subject')} onFocus={focus} onBlur={blur} required style={inp}>
                {SUBJECTS.map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>

            {/* 5. Categoría buttons */}
            <div style={{marginBottom:18}}>
              <label style={label}>5. Categoría de Biodiversidad *</label>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {CATEGORIES.map(c=>(
                  <button key={c} type="button" onClick={()=>setCat(c)} style={{
                    padding:'8px 16px',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'Inter,sans-serif',
                    background:form.category===c?VERDE:'white',
                    color:form.category===c?'white':'#374151',
                    border:form.category===c?`2px solid ${VERDE}`:'2px solid #e5e7eb',
                    transition:'all 0.15s'
                  }}>{c}</button>
                ))}
              </div>
            </div>

            {/* 6. Subir Fotografía */}
            <div style={{marginBottom:18}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <label style={{...label,marginBottom:0}}>6. Subir Fotografía *</label>
                <div style={{display:'flex',gap:0,border:'2px solid #e5e7eb',borderRadius:8,overflow:'hidden'}}>
                  {['Horizontal','Vertical'].map(o=>(
                    <button key={o} type="button" onClick={()=>setOrientation(o)} style={{
                      padding:'4px 14px',fontSize:12,fontWeight:600,fontFamily:'Inter,sans-serif',cursor:'pointer',border:'none',
                      background:orientation===o?VERDE:'white',color:orientation===o?'white':'#666',transition:'all 0.15s'
                    }}>{o}</button>
                  ))}
                </div>
              </div>
              <div onClick={()=>fileRef.current.click()} style={{
                border:`2px dashed ${imgPrev?VERDE:'#d1d5db'}`,borderRadius:12,padding:20,textAlign:'center',
                cursor:'pointer',background:imgPrev?'#f0fdf4':'#fafafa',transition:'all 0.2s'
              }}>
                {imgPrev
                  ?<div><img src={imgPrev} alt="" style={{maxHeight:80,maxWidth:'100%',borderRadius:8,display:'block',margin:'0 auto 6px'}}/><p style={{fontSize:11,color:VERDE,fontWeight:600}}>✅ Imagen cargada · Clic para cambiar</p></div>
                  :<div>
                    <div style={{fontSize:32,color:VERDE,marginBottom:8}}>⬆️</div>
                    <p style={{fontSize:13,color:'#374151',fontWeight:600}}>Haz clic o arrastra aquí tu foto</p>
                    <p style={{fontSize:11,color:'#9ca3af',marginTop:4}}>Soporta imágenes JPG, PNG o WEBP (Soporta orientación vertical u horizontal)</p>
                  </div>
                }
                <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{display:'none'}}/>
              </div>

              {/* Sample photos */}
              <div style={{marginTop:14}}>
                <p style={{fontSize:11,fontWeight:700,color:'#6b7280',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>¿No tienes foto a la mano? Selecciona una de prueba:</p>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                  {SAMPLE_PHOTOS.map((s,i)=>(
                    <button key={i} type="button" onClick={()=>useSample(s)} style={{
                      display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:10,cursor:'pointer',
                      border:'1.5px solid #e5e7eb',background:'white',fontFamily:'Inter,sans-serif',textAlign:'left',transition:'border 0.2s'
                    }}>
                      <img src={s.img} alt="" style={{width:36,height:36,borderRadius:6,objectFit:'cover',flexShrink:0}}/>
                      <div>
                        <div style={{fontSize:12,fontWeight:600,color:'#1a1a1a',lineHeight:1.2}}>{s.label}</div>

                  ))}
                </div>
              </div>
            </div>

            {/* 7. Pie de foto */}
            <div style={{marginBottom:20}}>
              <label style={label}>7. Pie de Foto / Descripción Explicativa *</label>

                style={{...inp,resize:'vertical',lineHeight:1.6}}/>
            </div>

            {/* Ethics checkbox */}
            <div style={{background:'#fffbeb',border:'1.5px solid #d4a017',borderRadius:10,padding:'12px 16px',marginBottom:20,display:'flex',gap:12,alignItems:'flex-start'}}>
              <input type="checkbox" id="ethics" checked={ethicsOk} onChange={e=>setEthicsOk(e.target.checked)} style={{marginTop:2,width:16,height:16,cursor:'pointer',flexShrink:0}}/>
              <label htmlFor="ethics" style={{fontSize:13,lineHeight:1.5,cursor:'pointer'}}>
                <strong style={{color:ROJO}}>Regla de Oro de Ética Fotográfica:</strong> Confirmo que NO molesté, toqué, capturé ni dañé a ningún ser vivo para tomar esta fotografía.
              </label>
            </div>

            {/* Submit */}
            <button type="submit" disabled={!canSubmit||submitting}
              style={{
                width:'100%',padding:'14px',borderRadius:12,fontSize:15,fontWeight:700,
                background:canSubmit&&!ethicsOk===false&&!submitting?VERDE:'#9ca3af',
                color:'white',border:'none',cursor:canSubmit&&!submitting?'pointer':'not-allowed',
                fontFamily:'Inter,sans-serif',opacity:canSubmit&&!submitting?1:0.6,
                display:'flex',alignItems:'center',justifyContent:'center',gap:8,transition:'all 0.2s'
              }}>
              {submitting?'⏳ Enviando...':'✨ Postular Obra a la Galería'}
            </button>
          </form>

          {/* ─ RIGHT: Preview ─ */}
          <div style={{position:'sticky',top:100}}>
            {/* Preview header */}
            <div style={{background:'#1a1a2e',borderRadius:'16px 16px 0 0',padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:16}}>🖼️</span>
                <span style={{color:'white',fontWeight:700,fontSize:14}}>Previsualización del Marco Institucional</span>
              </div>
              <span style={{background:VERDE,color:'white',fontSize:11,fontWeight:700,padding:'4px 12px',borderRadius:20}}>Vista previa en tiempo real</span>
            </div>
            <div style={{background:'#111827',borderRadius:'0 0 16px 16px',padding:'16px 20px 20px'}}>
              <p style={{color:'#9ca3af',fontSize:12,marginBottom:16,lineHeight:1.5}}>Así es exactamente como los docentes y la comunidad visualizarán tu obra de arte en la galería pública.</p>
              {imgPrev
                ?<Frame sub={{...form,image:imgPrev}}/>
                :<div style={{background:'#1f2937',border:'2px dashed #374151',borderRadius:12,padding:'40px 20px',textAlign:'center'}}>
                  <div style={{fontSize:32,marginBottom:12}}>🏷️</div>
                  <p style={{color:'#6b7280',fontSize:13}}>Carga o selecciona una fotografía para previsualizar el marco</p>
                  {form.category && <div style={{marginTop:16}}><Frame sub={{...form,image:null}}/></div>}
                </div>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

const downloadFrame = (sub, setBusy) => {
  if(setBusy) setBusy(true);
  /* A5 at 96dpi = 559 x 794 px */
  const W=559, H=794;
  const photoHtml = sub.image
    ? '<img src="'+sub.image+'" style="width:100%;height:100%;object-fit:cover;display:block"/>'
    : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1a3020;color:#6ee7b7;font-size:14px;">Sin imagen</div>';

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:'+W+'px;height:'+H+'px;z-index:-999;';

  const card = document.createElement('div');
  card.style.cssText = [
    'width:'+W+'px;height:'+H+'px;display:flex;flex-direction:column;',
    'border:10px solid #004D26;outline:3px solid #D92323;',
    'background:#FCFCF8;overflow:hidden;font-family:Arial,sans-serif;box-sizing:border-box;'
  ].join('');

  card.innerHTML = [
    /* ── HEADER ── */
    '<div style="background:linear-gradient(135deg,#004D26,#0A7E46);padding:14px 20px;',
      'display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">',
      '<div>',
        '<div style="font-size:9px;color:#a7f3d0;font-weight:700;letter-spacing:.18em;',
          'text-transform:uppercase;margin-bottom:4px;">Categoría:</div>',
        '<div style="font-size:28px;color:white;font-weight:900;line-height:1;">'+sub.category+'</div>',
      '</div>',
      '<img src="'+ESCUDO+'" style="height:68px;width:68px;object-fit:contain;',
        'filter:drop-shadow(0 2px 5px rgba(0,0,0,.4));"/>',
    '</div>',
    /* ── PHOTO ── */
    '<div style="flex:1;min-height:0;overflow:hidden;',
      'border-top:4px solid #D92323;border-bottom:4px solid #D92323;background:#111;">',
      photoHtml,
    '</div>',
    /* ── PIE DE FOTO ── */
    '<div style="border-left:5px solid #D92323;margin:10px 20px 8px;padding:7px 13px;',
      'background:#fff8f8;border-radius:0 5px 5px 0;">',
      '<div style="font-size:12px;font-weight:700;color:#1a1a1a;">Pie de foto:</div>',
      '<div style="font-size:11px;color:#444;font-style:italic;line-height:1.4;margin-top:3px;">'+sub.description+'</div>',
    '</div>',
    /* ── INFO ROW ── */
    '<div style="margin:0 20px 10px;padding:10px 15px;background:#f0fdf4;border-radius:9px;',
      'border:1px solid #d1fae5;display:flex;justify-content:space-between;align-items:center;',
      'gap:10px;flex-shrink:0;">',
      '<div style="font-size:11px;line-height:1.9;color:#1a1a1a;">',
        '<div><b>&#128100; Nombres y apellidos:</b> '+sub.name+'</div>',
        '<div><b>&#128197; Fecha:</b> '+sub.date+'</div>',
        '<div><b>&#127891; Grado:</b> '+sub.grade+'</div>',
        '<div><b>&#128218; Asignatura:</b> '+sub.subject+'</div>',
      '</div>',
      '<div style="text-align:center;flex-shrink:0;">',
        '<img src="'+BANNER+'" style="height:46px;object-fit:contain;display:block;margin-bottom:4px;"/>',
        '<div style="font-size:8px;font-weight:800;color:#004D26;letter-spacing:.07em;text-transform:uppercase;">Barrancabermeja</div>',
      '</div>',
    '</div>',
    /* ── FOOTER ── */
    '<div style="background:linear-gradient(135deg,#004D26,#0A7E46);padding:8px 20px;',
      'text-align:center;flex-shrink:0;">',
      '<p style="font-size:8px;color:#d1fae5;line-height:1.5;text-transform:uppercase;letter-spacing:.04em;">',
        CONFIG.motto,
      '</p>',
    '</div>',
  ].join('');

  wrap.appendChild(card);
  document.body.appendChild(wrap);

  html2canvas(card, {
    scale: 3,
    useCORS: true,
    allowTaint: true,
    backgroundColor: '#FCFCF8',
    logging: false,
    width: W,
    height: H,
  }).then(canvas => {
    document.body.removeChild(wrap);
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a5'});
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    doc.addImage(imgData, 'JPEG', 0, 0, 148, 210);
    const safe = (sub.name||'foto').replace(/[^a-zA-Z0-9À-ɏ\s_-]/g,'').replace(/\s+/g,'-').slice(0,40);
    doc.save('postal-IdentiCASD-'+safe+'.pdf');
    if(setBusy) setBusy(false);
  }).catch(()=>{ if(setBusy) setBusy(false); });
};

const TeacherPage = ({onUpdate, notify, apiBase}) => {
  const [auth,setAuth]=useState(false);
  const [pwd,setPwd]=useState('');
  const [showPwd,setShowPwd]=useState(false);
  const [err,setErr]=useState(false);
  const [subs,setSubs]=useState([]);
  const [loading,setLoading]=useState(false);
  const [sel,setSel]=useState(null);
  const [editing,setEditing]=useState(false);
  const [editData,setEditData]=useState({});
  const [comment,setComment]=useState('');
  const [pendingStatus,setPendingStatus]=useState(null);
  const [tab,setTab]=useState('Todos');

  const loadSubs = (pass) => {
    setLoading(true);
    fetch((apiBase||'')+'/api/docente/fotos', {
      headers:{'x-teacher-password': pass||pwd},
    }).then(r=>r.json()).then(d=>{
      if(d.fotos) setSubs(d.fotos);
      setLoading(false);
    }).catch(()=>setLoading(false));
  };

  const login = () => {
    fetch((apiBase||'')+'/api/docente/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pwd}),
    }).then(r=>r.json()).then(d=>{
      if(d.ok){ setAuth(true); setErr(false); loadSubs(pwd); }
      else setErr(true);
    }).catch(()=>setErr(true));
  };

  const openSel=(sub)=>{setSel(sub);setComment(sub.comentarios||sub.comments||'');setEditing(false);setEditData({...sub});setPendingStatus(null);};
  const setE=k=>e=>setEditData(d=>Object.assign({...d},{[k]:e.target.value}));

  const saveEdits=()=>{
    onUpdate(editData.id, editData.status, comment, editData, pwd).then(updated=>{
      if(updated){
        setSubs(s=>s.map(x=>x.id===updated.id?updated:x));
        setSel(updated);
      }
      setEditing(false);
    });
  };

  if(!auth) return (
    <div style={{background:CREMA,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
      <div style={{background:'white',borderRadius:24,boxShadow:'0 8px 40px rgba(0,77,38,0.12)',padding:40,width:'100%',maxWidth:400,textAlign:'center'}}>
        <div style={{marginBottom:6}}>
          <span style={{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:700,fontStyle:'italic',color:VERDE_DARK}}>Identi</span>
          <span style={{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:800,color:VERDE_DARK}}>CASD-JPP</span>
        </div>
        <div style={{width:56,height:56,background:VERDE_DARK,borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24,margin:'0 auto 16px'}}>🛡️</div>
        <h2 style={{fontSize:20,fontWeight:800,color:VERDE_DARK,marginBottom:4}}>Panel Docente</h2>
        <p style={{color:'#888',fontSize:13,marginBottom:24}}>Acceso restringido · Solo personal autorizado</p>
        <div style={{position:'relative',marginBottom:6}}>
          <input type={showPwd?'text':'password'} value={pwd} onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()}
            placeholder="Contraseña institucional"
            style={{width:'100%',border:`2px solid ${err?ROJO:'#e5e7eb'}`,borderRadius:10,padding:'11px 42px 11px 14px',fontSize:14,fontFamily:'Inter,sans-serif',outline:'none',boxSizing:'border-box'}}/>
          <button type="button" onClick={()=>setShowPwd(v=>!v)}
            style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:16,color:'#9ca3af'}}>
            {showPwd?'🙈':'👁️'}
          </button>
        </div>
        {err&&<p style={{color:ROJO,fontSize:12,marginBottom:6,textAlign:'left'}}>⚠ Contraseña incorrecta. Intenta de nuevo.</p>}
        <button onClick={login} style={{width:'100%',padding:'13px',borderRadius:12,fontSize:14,fontWeight:700,background:VERDE_DARK,color:'white',border:'none',cursor:'pointer',fontFamily:'Inter,sans-serif',marginTop:8}}>
          🔐 Ingresar al Panel
        </button>
      </div>
    </div>
  );

  const tabs=['Todos',...STATUSES];
  const filtered=tab==='Todos'?subs:subs.filter(s=>s.status===tab);
  const count=s=>s==='Todos'?subs.length:subs.filter(x=>x.status===s).length;
  const inp={border:'2px solid #e5e7eb',borderRadius:8,padding:'7px 10px',fontSize:12,fontFamily:'Inter,sans-serif',outline:'none',width:'100%',boxSizing:'border-box',marginBottom:10};

  return (
    <div style={{background:CREMA,minHeight:'100vh'}}>

      {/* ── Page Hero ── */}
      <div style={{padding:'28px 24px 0',maxWidth:1280,margin:'0 auto'}}>
        <div style={{background:`linear-gradient(160deg,${VERDE_HERO} 0%,#0f4d28 100%)`,borderRadius:20,padding:'24px 32px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
          <div style={{display:'flex',alignItems:'center',gap:16}}>
            <div style={{background:'rgba(255,255,255,0.15)',width:48,height:48,borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>🛡️</div>
            <div>
              <h2 className="serif" style={{fontSize:24,fontWeight:800,color:'white',marginBottom:2}}>Panel Docente</h2>
              <p style={{color:'#a7f3d0',fontSize:13}}>{subs.length} fotografías · {subs.filter(s=>s.status==='Aprobada').length} aprobadas · {subs.filter(s=>s.status==='Pendiente').length} pendientes</p>
            </div>
          </div>
          <button onClick={()=>setAuth(false)} style={{background:'rgba(217,35,35,0.25)',color:'#fca5a5',border:'1px solid rgba(217,35,35,0.4)',borderRadius:8,padding:'7px 16px',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'Inter,sans-serif'}}>🚪 Cerrar sesión</button>
        </div>
      </div>

      <div style={{maxWidth:1280,margin:'0 auto',padding:'24px 24px 48px'}}>
        {/* Tabs */}
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:20}}>
          {tabs.map(s=>{
            const clr={'Pendiente':'#ca8a04','Aprobada':'#16a34a','Requiere Ajustes':'#ea580c','Rechazada':'#dc2626','Todos':VERDE};
            return <button key={s} onClick={()=>setTab(s)} style={{
              background:tab===s?(clr[s]||VERDE):'white',
              color:tab===s?'white':'#555',border:`2px solid ${tab===s?(clr[s]||VERDE):'#e5e7eb'}`,
              padding:'6px 16px',borderRadius:20,fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'Inter,sans-serif'
            }}>{s} ({count(s)})</button>;
          })}</div>

        <div className="teacher-layout" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,alignItems:'start'}}>

          {/* ─ List ─ */}

                <img src={sub.image} alt="" style={{width:62,height:62,objectFit:'cover',borderRadius:10,flexShrink:0}}/>

                  </div>
                  <div style={{display:'flex',gap:6,marginBottom:4,flexWrap:'wrap'}}>

             {/* Panel header */}

                <span style={{color:'white',fontWeight:700,fontSize:14}}>Detalle de la Obra</span>
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  
                  {/* ⭐ BOTÓN DE ESTRELLA */}
                  <button 
                    onClick={async () => {

/* ════════════════════════════════════
   API helpers
════════════════════════════════════ */
const API = CONFIG.apiBase || '';

const apiFetch = (path, opts={}) =>
  fetch(API + path, Object.assign({headers:{'Content-Type':'application/json'}}, opts))
    .then(r => r.ok ? r.json() : r.json().then(e=>Promise.reject(e)));

/* ════════════════════════════════════
   APP
════════════════════════════════════ */
const App = () => {
  const [page,setPage]=useState('home');
  const [subs,setSubs]=useState([]);
  const [stats,setStats]=useState({total:0,approved:0});
  const [toast,setToast]=useState(null);

  const notify=(msg,type='success')=>setToast({msg,type,k:Date.now()});

  /* Cargar estadísticas públicas para el Inicio */
  const refreshStats = () => {
    apiFetch('/api/fotos')
      .then(d=>setStats({total:d.total,approved:d.total}))
      .catch(()=>{});
  };
  useEffect(()=>{ refreshStats(); },[]);

  /* Recibir nueva foto desde el formulario */
  const handleSubmit = (formData, imageBlob) => {
    const fd = new FormData();
    fd.append('nombre',      formData.name);
    fd.append('grado',       formData.grade);
    fd.append('asignatura',  formData.subject);
    fd.append('fecha',       formData.date);
    fd.append('categoria',   formData.category);
    fd.append('descripcion', formData.description);
    if(imageBlob) fd.append('imagen', imageBlob, 'foto.jpg');

    return fetch(API+'/api/fotos', {method:'POST', body:fd})
      .then(r=>r.json())
      .then(d=>{
        if(d.ok){
          notify('¡Fotografía postulada! El docente la revisará pronto.','success');
          refreshStats();
          return true;
        }
        notify(d.error||'Error al postular','error');
        return false;
      })
      .catch(()=>{ notify('Error de conexión al servidor','error'); return false; });
  };

  /* Panel docente: actualizar estado */
  const handleUpdate = (id, status, comments, editedData, teacherPass) => {
    // editedData va primero para que status y comentarios (los correctos) no sean sobreescritos
    const body = Object.assign({}, editedData||{}, {status, comentarios:comments});
    return fetch(API+'/api/docente/fotos/'+id, {
      method:'PATCH',
      headers:{'Content-Type':'application/json','x-teacher-password':teacherPass},
      body: JSON.stringify(body),
    })
    .then(r=>r.json())
    .then(d=>{
      if(d.ok){
        const m={'Aprobada':'✅ Aprobada y publicada','Rechazada':'❌ Rechazada','Requiere Ajustes':'🔄 Ajustes solicitados','Pendiente':'⏳ Restablecida'};
        notify(m[status]||'Actualizado', status==='Aprobada'?'success':status==='Rechazada'?'error':'info');
        return d.foto;
      }
      notify(d.error||'Error','error');
      return null;
    });
  };

  const pending = subs.filter(s=>s.status==='Pendiente').length;

  return (
    <div style={{minHeight:'100vh',background:CREMA,fontFamily:'Inter,sans-serif'}}>
      {toast&&<Toast key={toast.k} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      <Header page={page} go={setPage} pendingCount={pending}/>
      <main>
        {page==='home'&&<HomePage go={setPage} total={stats.total} approved={stats.approved}/>}
        {page==='submit'&&<SubmitPage onSubmit={handleSubmit} notify={notify}/>}
        {page==='gallery'&&<GalleryPage apiBase={API}/>}
        {page==='winners'&&<WinnersPage apiBase={API}/>}  {/* 👈 AÑADIR ESTA LÍNEA */}
        {page==='teacher'&&<TeacherPage onUpdate={handleUpdate} notify={notify} apiBase={API}/>}
      </main>
      <SiteFooter/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
